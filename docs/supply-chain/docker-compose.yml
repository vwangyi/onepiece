services:
  postgres:
    image: postgres:16-alpine
    container_name: supply-chain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supply_chain}
      POSTGRES_USER: ${POSTGRES_USER:-supply_chain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supply_chain_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - supply-chain-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-supply_chain} -d ${POSTGRES_DB:-supply_chain}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  supply-chain-postgres-data:
